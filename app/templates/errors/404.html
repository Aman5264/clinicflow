{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-question-circle fs-1 text-secondary d-block mb-3"></i>
        <h1 class="display-5 fw-bold">404 - Not Found</h1>
        <p class="lead text-muted">The requested page or patient record was not found.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
