{% extends "base.html" %}

{% block title %}System Error - 500{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-exclamation-triangle fs-1 text-warning d-block mb-3"></i>
        <h1 class="display-5 fw-bold">500 - Server Error</h1>
        <p class="lead text-muted">An unexpected server error occurred while processing your request.</p>
        <p class="text-muted small">Our technical operations log has safely recorded this event.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
